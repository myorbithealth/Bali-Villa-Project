name: Generate Bali construction leads

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that holds the GOOGLE_MAP_API secret (blank = auto-detect)
        type: string
        required: false
        default: ""
      target:
        description: Number of unique leads to collect
        type: string
        default: "1000"
      max_calls:
        description: Hard budget of Google API calls (aborts beyond this)
        type: string
        default: "1000"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.pick.outputs.env_name }}
      all_envs: ${{ steps.pick.outputs.all_envs }}
    steps:
      - name: Pick the environment holding the secret
        id: pick
        env:
          GH_INPUT_ENV: ${{ inputs.environment }}
        run: |
          if [ -n "$GH_INPUT_ENV" ]; then
            echo "Using environment from input: $GH_INPUT_ENV"
            echo "env_name=$GH_INPUT_ENV" >> "$GITHUB_OUTPUT"
            echo "all_envs=(input override)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments" > envs.json
          echo "Environments found:"
          jq -r '.environments[] | "\(.name)  (created \(.created_at))"' envs.json
          # Oldest environment = the one the user created (a newer empty
          # 'Google Maps API' env was auto-created by an earlier run).
          NAME=$(jq -r '.environments | sort_by(.created_at) | .[0].name // empty' envs.json)
          if [ -z "$NAME" ]; then
            echo "::error::No environments exist on this repository."
            exit 1
          fi
          echo "Picked: $NAME"
          echo "env_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "all_envs=$(jq -rc '[.environments[].name]' envs.json)" >> "$GITHUB_OUTPUT"

  generate:
    needs: discover
    runs-on: ubuntu-latest
    environment: ${{ needs.discover.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is present
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::Secret GOOGLE_MAP_API is empty in environment '${{ needs.discover.outputs.env_name }}'. Environments on this repo: ${{ needs.discover.outputs.all_envs }}. Re-run via workflow_dispatch passing the right environment name, or move the secret to Repository secrets."
            exit 1
          fi

      - name: Generate leads
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
        run: |
          python3 lead-generation/generate_leads.py \
            --target "${{ inputs.target || '1000' }}" \
            --max-calls "${{ inputs.max_calls || '1000' }}" \
            --out lead-generation/leads_bali_construction.csv \
            | tee lead-generation/last_run_summary.txt

      - name: Upload CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bali-construction-leads
          path: lead-generation/leads_bali_construction.csv
          if-no-files-found: ignore

      - name: Commit results to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lead-generation/leads_bali_construction.csv lead-generation/last_run_summary.txt
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Add generated Bali construction leads CSV"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
